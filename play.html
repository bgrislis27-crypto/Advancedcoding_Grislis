<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backrooms</title>
    <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #120e08;
  color: #f3e6c4;
  font-family: "Segoe UI", sans-serif;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
}

.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
}

.screen {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(10, 8, 4, 0.45);
}

.is-hidden {
  display: none;
}

.card {
  width: min(460px, calc(100% - 32px));
  padding: 28px;
  text-align: center;
  background: rgba(28, 22, 10, 0.82);
  border: 1px solid rgba(214, 176, 84, 0.35);
}

.card.danger {
  border-color: rgba(180, 40, 40, 0.7);
}

.kicker {
  margin: 0 0 8px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #e0c27a;
  font-size: 12px;
}

h1 {
  margin: 0 0 12px;
  font-size: 40px;
  letter-spacing: 0.04em;
}

p {
  margin: 0 0 14px;
  line-height: 1.45;
  color: #efe2c0;
}

.controls {
  color: #c8b48a;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  background: #f0e2bc;
  color: #241c0e;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.timer {
  position: absolute;
  top: 22px;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 28px;
  letter-spacing: 0.12em;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

.prompt {
  position: absolute;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  margin: 0;
  min-height: 1.2em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

.stamina {
  position: absolute;
  left: 28px;
  bottom: 28px;
  width: 180px;
  height: 8px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(240, 226, 188, 0.45);
}

#stamina-fill {
  width: 100%;
  height: 100%;
  background: #f0e2bc;
}

</style>
  </head>
  <body>
    <canvas id="game" aria-label="Backrooms hallways"></canvas>
    <div class="vignette"></div>

    <div id="start" class="screen">
      <div class="card">
        <p class="kicker">Find the exit</p>
        <h1>The Backrooms</h1>
        <p>
          The halls are random. A creature is searching. Hide in the dark corners,
          and reach the green exit before it catches you.
        </p>
        <p class="controls">Mouse to look · WASD to move · Shift to run · E to hide or escape</p>
        <button id="start-btn" type="button">Enter</button>
      </div>
    </div>

    <div id="hud" class="hud is-hidden">
      <p id="timer" class="timer">0:00</p>
      <p id="prompt" class="prompt"></p>
      <div class="stamina" aria-label="Stamina">
        <div id="stamina-fill"></div>
      </div>
    </div>

    <div id="win" class="screen is-hidden">
      <div class="card">
        <p class="kicker">Escaped</p>
        <h1>You got out</h1>
        <p id="win-time"></p>
        <button id="win-btn" type="button">Try another maze</button>
      </div>
    </div>

    <div id="lose" class="screen is-hidden">
      <div class="card danger">
        <p class="kicker">Caught</p>
        <h1>It found you</h1>
        <p id="lose-time"></p>
        <button id="lose-btn" type="button">Try again</button>
      </div>
    </div>
