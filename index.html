<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backrooms</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Backrooms hallways"></canvas>
    <div class="vignette"></div>
    <div id="fear"></div>

    <div id="start" class="screen">
      <div class="card">
        <p class="kicker">Find the exit</p>
        <h1>The Backrooms</h1>
        <p>
          The halls are random. A creature is searching. Hide in the dark corners,
          and reach the green exit before it catches you.
        </p>
        <p class="controls">Mouse to look · WASD to move · Shift to run · F flashlight · E to hide, open a door, or escape</p>
        <button id="start-btn" type="button">Enter</button>
      </div>
    </div>

    <div id="hud" class="hud is-hidden">
      <p id="timer" class="timer">0:00</p>
      <p id="prompt" class="prompt"></p>
      <div class="battery" aria-label="Flashlight battery">
        <div id="battery-fill"></div>
      </div>
      <div class="stamina" aria-label="Stamina">
        <div id="stamina-fill"></div>
      </div>
    </div>

    <div id="win" class="screen is-hidden">
      <div class="card">
        <p class="kicker">Escaped</p>
        <h1>You got out</h1>
        <p id="win-time"></p>
        <button id="win-btn" type="button">Try another maze</button>
      </div>
    </div>

    <div id="lose" class="screen is-hidden">
      <div class="card danger">
        <p class="kicker">Caught</p>
        <h1>It found you</h1>
        <p id="lose-time"></p>
        <button id="lose-btn" type="button">Try again</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
