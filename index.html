<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backrooms</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game" aria-label="Backrooms hallways"></canvas>
    <div class="vignette"></div>
    <div id="fear"></div>

    <div id="start" class="screen menu-screen">
      <div class="menu-wrap">
        <h1 class="logo"><span>•</span> BACKROOMS <span>•</span></h1>

        <div id="menu-main" class="menu-list">
          <p class="menu-label">MAIN MENU</p>
          <button id="start-btn" type="button">WAKE UP</button>
          <button id="settings-btn" type="button">SETTINGS</button>
          <button id="more-btn" type="button">MORE OPTIONS</button>
          <p id="mode-label" class="menu-note">CLASSIC MODE</p>
        </div>

        <div id="menu-settings" class="menu-list is-hidden">
          <p class="menu-label">SETTINGS</p>
          <p class="menu-note">MOUSE LOOK<br />WASD MOVE<br />SHIFT RUN<br />F FLASHLIGHT<br />E DOOR, HIDE, OR EXIT</p>
          <button id="settings-back" type="button">BACK</button>
        </div>

        <div id="menu-more" class="menu-columns is-hidden">
          <div class="menu-list">
            <p class="menu-label">MAIN MENU</p>
            <button id="more-wake" type="button">WAKE UP</button>
            <button id="more-back" type="button">BACK</button>
            <button id="more-settings" type="button">SETTINGS</button>
            <button id="more-stay" type="button">MORE OPTIONS</button>
          </div>
          <div class="menu-list">
            <p class="menu-label">GAME MODE</p>
            <button class="mode-btn is-picked" type="button" data-mode="classic">CLASSIC MODE</button>
            <button class="mode-btn" type="button" data-mode="deaf">DEAF MODE</button>
            <button class="mode-btn" type="button" data-mode="free">FREE MODE</button>
            <p id="mode-note" class="menu-note">THE ENTITY CAN HEAR YOU.</p>
          </div>
        </div>
      </div>
      <p class="headphones">HEADPHONES ARE RECOMMENDED</p>
    </div>

    <div id="hud" class="hud is-hidden">
      <p id="timer" class="timer">0:00</p>
      <p id="prompt" class="prompt"></p>
      <div class="battery" aria-label="Flashlight battery">
        <div id="battery-fill"></div>
      </div>
      <div class="stamina" aria-label="Stamina">
        <div id="stamina-fill"></div>
      </div>
    </div>

    <div id="win" class="screen is-hidden">
      <div class="card">
        <p class="kicker">Escaped</p>
        <h1>You got out</h1>
        <p id="win-time"></p>
        <button id="win-btn" type="button">Try another maze</button>
      </div>
    </div>

    <div id="lose" class="screen is-hidden">
      <div class="card danger">
        <p class="kicker">Caught</p>
        <h1>It found you</h1>
        <p id="lose-time"></p>
        <button id="lose-btn" type="button">Try again</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
