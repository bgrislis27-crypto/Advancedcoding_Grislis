<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Survive</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- The 3D world is drawn on this full-screen canvas. -->
    <canvas id="game" aria-label="First-person wilderness"></canvas>

    <!-- Shown first. Click the button to start walking around. -->
    <div id="start" class="start">
      <div class="start-card">
        <p class="kicker">Wilderness survival</p>
        <h1>Survive</h1>
        <p class="start-copy">
          Click to look around with the mouse. Walk with WASD or the arrow keys.
          Hold Shift to sprint.
        </p>
        <button id="start-btn" type="button">Enter the forest</button>
      </div>
    </div>

    <!-- In-game overlay: meters, bow draw bar, and arrow count. -->
    <div id="hud" class="hud is-hidden">
      <div class="crosshair"></div>

      <!-- Four survival rings. --p is how full each ring is (0% to 100%). -->
      <div class="meters">
        <div class="ring" id="meter-stamina" style="--p: 100%">
          <svg viewBox="0 0 24 24" aria-label="Stamina">
            <path d="M13 3L6 14h5l-1 7 8-12h-5l1-6z" />
          </svg>
        </div>
        <div class="ring" id="meter-hunger" style="--p: 86%">
          <svg viewBox="0 0 24 24" aria-label="Hunger">
            <path d="M4 3v8a3 3 0 0 0 3 3v7h2V3H7v7H6V3H4zm12 0c-2 3-2 6-2 9v9h2v-6h1c2 0 3-2 3-5V3h-2v8h-1V3h-1z" />
          </svg>
        </div>
        <div class="ring" id="meter-thirst" style="--p: 74%">
          <svg viewBox="0 0 24 24" aria-label="Thirst">
            <path d="M12 2s6 7.2 6 12a6 6 0 1 1-12 0c0-4.8 6-12 6-12z" />
          </svg>
        </div>
        <div class="ring" id="meter-health" style="--p: 100%">
          <svg viewBox="0 0 24 24" aria-label="Health">
            <path d="M12 21s-7.2-4.6-9.3-8.4C1 9.4 2.4 6 5.6 6c1.8 0 3.1 1 3.9 2.2C10.3 7 11.6 6 13.4 6c3.2 0 4.6 3.4 2.9 6.6C19.2 16.4 12 21 12 21z" />
          </svg>
        </div>
      </div>

      <!-- Thin bar in the middle: how far the bow is pulled. -->
      <div class="draw-meter" id="draw-meter"></div>

      <!-- Equipped arrows on the right. -->
      <div class="arrows"><strong>1</strong><span>16</span></div>
    </div>

    <!-- Three.js is loaded from a CDN. main.js starts the game after that. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
