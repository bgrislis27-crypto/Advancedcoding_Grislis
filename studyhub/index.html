<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StudyHub</title>
    <meta name="description" content="StudyHub is a homework planner that stays in this browser: assignments, a calendar, a study timer, and a grade calculator." />
    <meta name="theme-color" content="#0b1020" id="theme-color" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      /* Match the saved theme before the first paint. Keep this key in sync with js/store.js. */
      (function () {
        try {
          var raw = localStorage.getItem("studyhub.v1");
          if (!raw) return;
          var theme = JSON.parse(raw).theme;
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (error) {
          /* Keep the default dark theme if storage cannot be read. */
        }
      })();
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="shell">
      <div id="sidebar-backdrop" class="sidebar-backdrop" data-action="close-sidebar" hidden></div>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="icon"><path d="M5 12.5l4.2 4.2L19 7.2"></path></svg>
          </div>
          <div>
            <p class="brand-name">StudyHub</p>
            <p class="brand-tag">Homework planner</p>
          </div>
        </div>
        <nav class="nav" aria-label="Primary">
          <button type="button" class="nav-btn is-active" data-nav="dashboard" aria-current="page">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect></svg>
            Dashboard
          </button>
          <button type="button" class="nav-btn" data-nav="assignments">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8.5 12.2l2.3 2.3 4.7-5"></path></svg>
            Assignments
            <span class="nav-badge" data-badge="overdue" hidden>0</span>
          </button>
          <button type="button" class="nav-btn" data-nav="calendar">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3.5v4M16 3.5v4"></path></svg>
            Calendar
          </button>
          <button type="button" class="nav-btn" data-nav="timer">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 13V9.5M12 13l2.4 1.6M9 3.5h6M12 3.5V5"></path></svg>
            Study Timer
          </button>
          <button type="button" class="nav-btn" data-nav="grades">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M8.5 8h7M8.5 12h7M8.5 16h4"></path></svg>
            Grade Calculator
          </button>
        </nav>
        <div class="sidebar-footer">
          <button type="button" class="theme-toggle" id="theme-toggle" data-action="toggle-theme" aria-label="Switch to light mode">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path></svg>
            <span>Light mode</span>
          </button>
          <p class="sidebar-note">Saved on this device</p>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-inner">
            <button type="button" class="icon-btn menu-btn" id="menu-btn" data-action="open-menu" aria-label="Open menu" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
            </button>
            <div class="topbar-copy">
              <h1 id="view-title">Dashboard</h1>
              <p id="view-subtitle">Today, what's due, and how you're doing.</p>
            </div>
            <button type="button" class="btn btn-primary" id="quick-add" data-action="open-assignment-form" aria-label="Add assignment">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              <span>Add assignment</span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <noscript>
            <div class="panel noscript">
              <h2>JavaScript is off</h2>
              <p>StudyHub needs JavaScript to save assignments in this browser. Turn it on, then reload the page.</p>
            </div>
          </noscript>
        </main>
      </div>
    </div>
    <nav class="tabbar" aria-label="Mobile">
      <button type="button" data-nav="dashboard">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect></svg>
        Dashboard
      </button>
      <button type="button" data-nav="assignments">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8.5 12.2l2.3 2.3 4.7-5"></path></svg>
        Assignments
        <span class="nav-badge" data-badge="overdue" hidden>0</span>
      </button>
      <button type="button" data-nav="calendar">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3.5v4M16 3.5v4"></path></svg>
        Calendar
      </button>
      <button type="button" data-nav="timer" aria-label="Study Timer">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 13V9.5M12 13l2.4 1.6M9 3.5h6M12 3.5V5"></path></svg>
        Timer
      </button>
      <button type="button" data-nav="grades" aria-label="Grade Calculator">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"></rect><path d="M8.5 8h7M8.5 12h7M8.5 16h4"></path></svg>
        Grades
      </button>
    </nav>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script src="js/util.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/store.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/forms.js"></script>
    <script src="js/assignments.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/grades.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
